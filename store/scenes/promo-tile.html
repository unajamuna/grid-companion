<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Promo tile</title>
<style>
  body { margin: 0; width: 440px; height: 280px; display: grid; place-items: center; overflow: hidden; font: 16px/1.4 -apple-system, system-ui, sans-serif; color: #fff;
    background: radial-gradient(80% 80% at 25% 20%, #2a4b3a, transparent 70%), #121214; }
  .wrap { display: grid; grid-template-columns: 96px 1fr; gap: 20px; align-items: center; padding: 0 32px; }
  img.leaf { width: 96px; } img.word { height: 26px; display: block; margin-bottom: 10px; }
  p { margin: 0; font-size: 17px; color: rgba(255,255,255,.8); }
</style></head>
<body><div class="wrap"><img class="leaf" src="/icon-512.png" alt=""><div><img class="word" src="/logo-grid-white.png" alt=""><p>A gentle pause before AI chats when the grid runs on gas.</p></div></div></body></html>
