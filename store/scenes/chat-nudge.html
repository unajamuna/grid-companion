<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Store shot: nudge</title>
<style>
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 260px 1fr; font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #222; }
  aside { background: #f4f4f5; padding: 20px; } aside div { height: 12px; margin: 14px 0; border-radius: 6px; background: #e4e4e7; } aside div:nth-child(2n) { width: 70%; }
  main { display: flex; flex-direction: column; padding: 40px 15%; gap: 18px; }
  .msg { max-width: 70%; padding: 12px 16px; border-radius: 16px; background: #f4f4f5; } .me { align-self: flex-end; background: #e8f0fe; }
  .box { margin-top: auto; border: 1px solid #e4e4e7; border-radius: 18px; padding: 16px; color: #999; }
</style></head>
<body>
  <aside><strong>AI Chat</strong><div></div><div></div><div></div><div></div><div></div></aside>
  <main>
    <div class="msg me">Can you rewrite these 40 product descriptions in a friendlier tone?</div>
    <div class="msg">Sure! Paste them in and I'll work through them one by one.</div>
    <div class="box">Message AI Chat…</div>
  </main>
  <script src="/extension/dev/fake-chrome.js"></script><script src="/extension/nudge-rules.js"></script><script src="/extension/content.js"></script>
</body></html>
